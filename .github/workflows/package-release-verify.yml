name: Package release verification

on:
  workflow_dispatch:
    inputs:
      package:
        description: Canonical package name from eng/packages.zig
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-release-verify-${{ inputs.package }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Zig via ghr
        uses: cataggar/ghr/actions/install@v0.7.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tools: |
            cataggar/zig@v0.16.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Validate package metadata and history
        run: zig build package-check package-history-check --summary all

      - name: Verify branch-owned package
        shell: bash
        run: scripts/package-branch-release.sh verify "$PACKAGE"
